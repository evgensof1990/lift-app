# Сборка APK «Лифт». Запуск: GitHub → Actions → «Android APK» → Run workflow
# (и сам — при каждом изменении в main). Готовый файл: внизу страницы запуска, раздел Artifacts.
# Адрес сервера, который откроет приложение: Settings → Secrets and variables → Actions → Variables → LIFT_URL.
# Пока LIFT_URL не задан — собирается демо-APK: работает без сервера, на примерных данных.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Вариант сборки
        env:
          LIFT_URL: ${{ vars.LIFT_URL }}
        run: |
          if [ -n "$LIFT_URL" ]; then
            echo "FLAVOR=server" >> "$GITHUB_ENV"
          else
            echo "FLAVOR=demo" >> "$GITHUB_ENV"
            echo "::notice::LIFT_URL не задан — собираю демо-APK без сервера"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Сборка приложения
        run: |
          npm ci --no-audit --no-fund
          if [ "$FLAVOR" = demo ]; then VITE_DEMO=1 npm run build -w web; else npm run build -w web; fi

      - name: Android-проект
        working-directory: apps/web
        env:
          LIFT_URL: ${{ vars.LIFT_URL }}
        run: |
          if [ "$FLAVOR" = demo ]; then unset LIFT_URL; fi
          npx cap sync android

      - name: APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/lift-${FLAVOR}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lift-apk
          path: out/*.apk
          retention-days: 30
